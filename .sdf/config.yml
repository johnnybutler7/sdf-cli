repo: sdf-cli
kind: python-cli
governance_mode: required
automatic_execution_permitted: false
front_door_release: "v0.1.0"
front_door_package: "software-dark-factory 0.1.0"
evidence_dir: .sdf/evidence
work_items_dir: .sdf/work-items
receiver_playbooks:
  - name: SDF CLI engineering discipline
    path: docs/playbooks/engineering/README.md
