      - engineering
      - architecture
      - maintainability
      - design
      - boundaries
      - testing
  - name: SDF CLI Python guidance
    path: docs/playbooks/python/README.md
    categories:
      - implementation
      - python
      - cli
      - architecture
      - filesystem
      - git
      - subprocess
      - testing
      - fixtures
      - golden_outputs
      - packaging
      - resources
      - tooling
      - quality
      - linting
      - typing
      - dependencies
      - learning
  - name: SDF CLI product guidance
    path: docs/product/README.md
    categories:
      - product
      - north_star
      - decision_context
      - evidence
      - dogfood
      - workflow
      - boundaries
      - provenance
  - name: SDF CLI verification guidance
    path: docs/verification/README.md
    categories:
      - verification
      - fixtures
      - golden_outputs
