version: 1
commands:
  - name: ruff
    command: python3 -m ruff check src tests
    track_timing: true
  - name: python-module-size-audit
    command: python3 scripts/check_python_module_size.py src tests
    track_timing: true
  - name: documented-sdf-command-consistency
    command: python3 scripts/check_documented_sdf_commands.py --repo .
    track_timing: true
  - name: cli-help
    command: PYTHONPATH=src python3 -m sdf_cli.main --help
  - name: cli-version
    command: PYTHONPATH=src python3 -m sdf_cli.main --version
  - name: status-current-repo
    command: PYTHONPATH=src python3 -m sdf_cli.main status --repo .
  - name: guidance-current-repo
    command: PYTHONPATH=src python3 -m sdf_cli.main guidance --repo .
  - name: install-surface-smoke
    command: python3 scripts/check_editable_install.py --upgrade-pip --skip-full-verification-run
    track_timing: true
  - name: wheel-packaging-smoke
    command: PYTHONPATH=src python3 -m unittest tests.test_wheel_packaging_smoke
    track_timing: true
  - name: python-unit-tests
    command: PYTHONPATH=src python3 -m unittest discover -s tests
    track_timing: true
